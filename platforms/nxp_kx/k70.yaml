- match:
    variant: 1M0
  mem:
    vectors:
      origin: 0x0
      size: 1k
    fopt:
      origin: 0x400
      size: 0x10
    flash:
      # 1M less kinetis hell
      origin: 0x410
      size: 0xffbf0

    ram:
      # Actually, two regions, but we don't care about that right now...
      origin: 0x1FFF0000
      size: 128K

- mem:
    vectors:
      origin: 0x0
      size: 1k
    fopt:
      origin: 0x400
      size: 0x10
    flash:
      # 512k less kinetis hell
      origin: 0x410
      size: 0x7fbf0

    ram:
      # Actually, two regions, but we don't care about that right now...
      origin:  0x1FFF0000
      size: 128k


  periph:
    nxp_pcr_kx:
      PCRA:
        offset: 0x40049000
      PCRB:
